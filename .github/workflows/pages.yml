name: Déployer l'app (GitHub Pages)

# Chaque push sur main met l'app en ligne. Rien d'autre à faire.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # sw.js garde les fichiers en cache : sans nouveau nom de cache, les téléphones
      # ne verraient jamais les modifications. On le change à chaque déploiement.
      - name: Versionner le cache hors ligne
        run: sed -i "s/solo-looper-v[0-9A-Za-z]*/solo-looper-${GITHUB_SHA::7}/" sw.js

      - name: Préparer le site (sans la doc ni les fichiers de dev)
        run: |
          mkdir _site
          tar -c --exclude='./_site' --exclude='./.git' --exclude='./.github' --exclude='./docs' --exclude='*.md' -f - . | tar -x -C _site -f -

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
